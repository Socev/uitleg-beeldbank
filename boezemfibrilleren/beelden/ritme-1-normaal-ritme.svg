        <circle cx="165" cy="110" r="11" fill="#f2b233" stroke="#a8740f" stroke-width="2.5"/>
        <circle cx="287" cy="236" r="9" fill="#f2b233" stroke="#a8740f" stroke-width="2.5"/>
        <path d="M152,104 L104,78" stroke="#8f8f8f" stroke-width="2"/>
        <text x="66" y="44" font-size="16" font-weight="700" fill="#24201f" text-anchor="middle">sinusknoop</text>
        <text x="66" y="64" font-size="14" fill="#5d5753" text-anchor="middle">(gangmaker)</text>
        <path d="M278,240 L90,262" stroke="#8f8f8f" stroke-width="2"/>
        <text x="66" y="282" font-size="16" font-weight="700" fill="#24201f" text-anchor="middle">AV-knoop</text>
        <text x="66" y="302" font-size="14" fill="#5d5753" text-anchor="middle">(doorgeefluik)</text>
