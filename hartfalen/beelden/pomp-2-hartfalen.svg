<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" role="img" aria-labelledby="hf-t" width="560" height="600">
        <title id="hf-t">Een lichaam met hart en longen. Gezond: het hart pompt het bloed goed rond. Hartfalen: het hart pompt minder goed en er hoopt zich vocht op in de longen en de enkels.</title>
        <style>
svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
/* tekeningen: kleuren en bewegingen */
.zweef { animation: zweef 3.2s ease-in-out infinite alternate; transform-box: fill-box; }
.zweef.b { animation-delay: -1.1s; } .zweef.c { animation-delay: -2.1s; } .zweef.d { animation-duration: 2.6s; }
@keyframes zweef { from { transform: translate(-3px, -4px); } to { transform: translate(4px, 4px); } }
.stroom { stroke-dasharray: 10 14; animation: stroom 1.4s linear infinite; }
.stroom.traag { animation-duration: 3.2s; }
@keyframes stroom { to { stroke-dashoffset: -48; } }
.klop { transform-box: fill-box; transform-origin: center; animation: klop 1s ease-in-out infinite; }
.klop.zwak { animation: klopzwak 1.25s ease-in-out infinite; }
@keyframes klop { 0%, 60%, 100% { transform: scale(1); } 20% { transform: scale(1.13); } }
@keyframes klopzwak { 0%, 60%, 100% { transform: scale(1); } 20% { transform: scale(1.04); } }
.golf { transform-box: fill-box; transform-origin: center; animation: golf 1.6s ease-out infinite; }
@keyframes golf { 0% { transform: scale(.1); opacity: .9; } 70% { opacity: .35; } 100% { transform: scale(1); opacity: 0; } }
.seintje { stroke-dasharray: 26 400; animation: seintje 1.6s linear infinite; }
@keyframes seintje { 0%, 30% { stroke-dashoffset: 26; } 75%, 100% { stroke-dashoffset: -260; } }
.flikker { animation: flikker .9s steps(2, jump-none) infinite; }
.flikker.b { animation-duration: .7s; animation-delay: -.3s; } .flikker.c { animation-duration: 1.1s; animation-delay: -.5s; }
@keyframes flikker { 0% { opacity: 1; } 100% { opacity: .15; } }
.kamerslag { animation: kamerslag 4.6s linear infinite; }
@keyframes kamerslag { 0%, 4%, 17%, 21%, 30%, 34%, 58%, 62%, 70%, 74%, 92%, 96%, 100% { opacity: 0; }
  2%, 19%, 32%, 60%, 72%, 94% { opacity: .55; } }
.kamerslag-r { animation: kamerslagr 1.6s linear infinite; }
@keyframes kamerslagr { 0%, 45%, 62%, 100% { opacity: 0; } 52% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) {
  .zweef, .stroom, .klop, .golf, .seintje, .flikker, .kamerslag, .kamerslag-r { animation: none !important; }
  .golf { transform: scale(.4); opacity: .5; } .seintje { stroke-dasharray: none; opacity: .7; }
  .kamerslag, .kamerslag-r { opacity: .3; } .flikker { opacity: .8; }
}
</style><defs>
          <clipPath id="longclip">
            <path d="M192,150 C162,148 146,176 144,216 C142,252 152,272 172,270 L194,264 Z"/>
            <path d="M208,150 C238,148 254,176 256,216 C258,252 248,272 228,270 L206,264 Z"/>
          </clipPath>
          <path id="druppel" d="M0,-9 C4,-3 7,1 7,5 A7,7 0 0 1 -7,5 C-7,1 -4,-3 0,-9 Z"/>
        </defs>
        <!-- lichaam -->
        <g fill="#ece5df">
          <circle cx="200" cy="62" r="38"/>
          <rect x="184" y="94" width="32" height="30"/>
          <path d="M128,122 Q200,108 272,122 L284,300 Q286,342 262,352 L138,352 Q114,342 116,300 Z"/>
          <path d="M132,128 Q106,134 100,172 L86,300 Q84,318 99,320 Q113,320 115,304 L134,190 Z"/>
          <path d="M268,128 Q294,134 300,172 L314,300 Q316,318 301,320 Q287,320 285,304 L266,190 Z"/>
          <path d="M142,340 L196,340 L190,520 Q190,540 188,556 L158,556 Q156,540 156,520 Z"/>
          <path d="M204,340 L258,340 L244,520 Q244,540 242,556 L212,556 Q210,540 210,520 Z"/>
          <ellipse cx="170" cy="566" rx="28" ry="12"/><ellipse cx="230" cy="566" rx="28" ry="12"/>
        </g>
        <!-- longen -->
        <g fill="#f6d6cd" stroke="#d9a395" stroke-width="2.5">
          <path d="M192,150 C162,148 146,176 144,216 C142,252 152,272 172,270 L194,264 Z"/>
          <path d="M208,150 C238,148 254,176 256,216 C258,252 248,272 228,270 L206,264 Z"/>
        </g>
        <!-- gezond -->
        <!-- hartfalen -->
        <g>
          <g fill="none" stroke="#d9443f" stroke-width="3" stroke-linecap="round" opacity=".55">
            <path class="stroom traag" d="M210,206 C210,170 204,140 200,104"/>
            <path class="stroom traag" d="M198,262 C194,320 176,400 172,520"/>
            <path class="stroom traag" d="M222,262 C226,320 230,400 228,520"/>
            <path class="stroom traag" d="M186,222 C150,214 126,236 108,300"/>
            <path class="stroom traag" d="M234,222 C270,214 280,236 296,300"/>
          </g>
          <!-- vocht in de longen -->
          <rect x="140" y="236" width="120" height="40" fill="#8fc3e6" opacity=".8" clip-path="url(#longclip)"/>
          <g fill="#3d8fc4"><use href="#druppel" x="160" y="226"/><use href="#druppel" x="240" y="226"/><use href="#druppel" x="176" y="208"/></g>
          <!-- dikke enkels -->
          <g fill="#ece5df"><ellipse cx="173" cy="534" rx="26" ry="26"/><ellipse cx="227" cy="534" rx="26" ry="26"/></g>
          <g fill="#8fc3e6" opacity=".55"><ellipse cx="173" cy="536" rx="24" ry="22"/><ellipse cx="227" cy="536" rx="24" ry="22"/></g>
          <g fill="#3d8fc4"><use href="#druppel" x="173" y="534"/><use href="#druppel" x="227" y="534"/></g>
          <g transform="translate(210,232)"><path class="klop zwak" d="M0,-12 C-8,-26 -32,-22 -32,-2 C-32,16 -12,28 0,38 C12,28 32,16 32,-2 C32,-22 8,-26 0,-12 Z" fill="#e0716c" stroke="#a8302c" stroke-width="2"/></g>
          <g stroke="#8f8f8f" stroke-width="2" fill="none"><path d="M330,170 L248,240"/><path d="M330,232 L262,232"/><path d="M330,520 L256,532"/></g>
          <text x="338" y="160" font-size="19" font-weight="700" fill="#2a6f97">vocht in de longen</text>
          <text x="338" y="182" font-size="16" fill="#5d5753">benauwd, vooral als je ligt</text>
          <text x="338" y="226" font-size="19" font-weight="700" fill="#a8302c">pompt minder goed</text>
          <text x="338" y="250" font-size="16" fill="#5d5753">sneller moe, sneller</text>
          <text x="338" y="270" font-size="16" fill="#5d5753">buiten adem</text>
          <text x="338" y="514" font-size="19" font-weight="700" fill="#2a6f97">dikke enkels</text>
          <text x="338" y="536" font-size="16" fill="#5d5753">vocht in de benen</text>
        </g>
      </svg>
