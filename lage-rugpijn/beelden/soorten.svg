<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 0 900 190" role="img" aria-labelledby="duur-t" width="900" height="190">
      <title id="duur-t">Tijdlijn. Gewone rugpijn is meestal binnen 4 weken minder. Bij een hernia gaat de pijn in het been bij 3 van de 4 mensen binnen 3 maanden over.</title>
      <style>
svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
</style><rect x="40" y="34" width="168" height="34" rx="17" fill="#e3f0f8" stroke="#2a6f97" stroke-width="2"/>
      <text x="124" y="57" text-anchor="middle" font-size="16" font-weight="700" fill="#2a6f97">gewone rugpijn</text>
      <text x="222" y="57" font-size="15" fill="#5d5753">meestal minder binnen 4 weken</text>
      <rect x="40" y="88" width="520" height="34" rx="17" fill="#fdf0e1" stroke="#b85c00" stroke-width="2"/>
      <text x="300" y="111" text-anchor="middle" font-size="16" font-weight="700" fill="#b85c00">hernia: bij 3 van de 4 mensen over binnen 3 maanden</text>
      <path d="M40,150 L560,150" stroke="#5d5753" stroke-width="2"/>
      <g stroke="#5d5753" stroke-width="2"><path d="M40,142 L40,158"/><path d="M213,142 L213,158"/><path d="M387,142 L387,158"/><path d="M560,142 L560,158"/></g>
      <g font-size="15" fill="#5d5753" text-anchor="middle">
        <text x="40" y="178">begin</text><text x="213" y="178">1 maand</text><text x="387" y="178">2 maanden</text><text x="560" y="178" text-anchor="end">3 maanden</text>
      </g>
    </svg>
