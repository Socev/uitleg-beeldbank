<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="tijd-t" width="760" height="330">
        <title id="tijd-t">Tijdlijn: bijwerkingen komen vaak in de eerste weken en worden daarna minder. Het effect komt na een paar weken.</title>
        <style>
svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
</style><rect x="340" y="56" width="140" height="196" fill="#e3f0f8"/>
        <text x="410" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#2a6f97">week 4 – 6</text>
        <text x="410" y="80" text-anchor="middle" font-size="14" fill="#2a6f97">samen kijken:</text>
        <text x="410" y="98" text-anchor="middle" font-size="14" fill="#2a6f97">helpt het?</text>
        <!-- assen -->
        <path d="M60,252 L740,252" stroke="#8f8f8f" stroke-width="2.5"/>
        <path d="M630,244 l10,16 M642,244 l10,16" stroke="#8f8f8f" stroke-width="2.5"/>
        <g font-size="15" fill="#5d5753" text-anchor="middle">
          <text x="60" y="278">start</text><text x="200" y="278">week 2</text><text x="340" y="278">week 4</text>
          <text x="480" y="278">week 6</text><text x="620" y="278">week 8</text><text x="705" y="278">maanden</text>
        </g>
        <g stroke="#8f8f8f" stroke-width="2"><path d="M60,252 v8 M200,252 v8 M340,252 v8 M480,252 v8 M620,252 v8"/></g>
        <!-- bijwerkingen -->
        <path d="M60,240 C75,130 110,112 150,125 C210,145 270,215 340,228 L740,232" stroke="#b85c00" stroke-width="5" fill="none" stroke-dasharray="12 8" stroke-linecap="round"/>
        <text x="160" y="110" font-size="17" font-weight="700" fill="#b85c00">bijwerkingen</text>
        <!-- effect -->
        <path d="M60,248 L150,246 C230,240 300,175 380,128 C430,100 480,92 620,90 L740,90" stroke="#2f7d5b" stroke-width="6" fill="none" stroke-linecap="round"/>
        <text x="560" y="78" font-size="17" font-weight="700" fill="#2f7d5b">minder somber</text>
        <text x="60" y="318" font-size="14" fill="#5d5753">Schematisch: zo gaat het bij veel mensen. Bij jou kan het anders zijn.</text>
      </svg>
