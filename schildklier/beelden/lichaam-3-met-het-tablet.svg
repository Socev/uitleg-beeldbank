        <path class="seintje" d="M163,119 C96,126 92,190 128,204" stroke="#2a6f97" stroke-width="6" fill="none" stroke-linecap="round"/>
        <g text-anchor="middle">
          <text x="62" y="104" font-size="17" font-weight="700" fill="#2a6f97">TSH</text>
          <text x="62" y="123" font-size="14" fill="#5d5753">seintje</text>
        </g>
        <!-- luchtpijp -->
        <rect x="162" y="150" width="16" height="92" rx="4" fill="#dfe7ec" stroke="#b9c6cf" stroke-width="2"/>
        <g stroke="#b9c6cf" stroke-width="2"><path d="M162,166 L178,166 M162,180 L178,180 M162,226 L178,226"/></g>
        <!-- schildklier: gewoon -->
        <!-- schildklier: werkt te langzaam -->
        <g fill="#f6dcd3" stroke="#c9867a" stroke-width="3">
          <ellipse cx="149" cy="205" rx="19" ry="30"/>
          <ellipse cx="191" cy="205" rx="19" ry="30"/>
          <rect x="158" y="206" width="24" height="14" rx="5" stroke="none"/>
        </g>
        <path d="M212,204 L330,198" stroke="#8f8f8f" stroke-width="2"/>
        <text x="340" y="204" font-size="19" font-weight="700" fill="#8a4035">schildklier</text>
        <text x="340" y="224" font-size="15" font-weight="700" fill="#b85c00">maakt te weinig hormoon</text>
        <!-- bloedbaan -->
        <g stroke="#f0b6ae" stroke-width="12" fill="none" stroke-linecap="round">
          <path d="M170,232 L170,300"/>
          <path d="M170,300 C120,315 76,350 72,520"/>
          <path d="M170,300 C220,315 264,350 268,520"/>
        </g>
        <g stroke="#2f7d5b" stroke-width="7" fill="none" stroke-linecap="round">
          <path class="stroom" d="M170,232 L170,300"/>
          <path class="stroom" d="M170,300 C120,315 76,350 72,520"/>
          <path class="stroom" d="M170,300 C220,315 264,350 268,520"/>
        </g>
        <!-- tempometer -->
        <g fill="none" stroke-width="14">
          <path d="M112,445 A58,58 0 0 1 141,394.8" stroke="#f2c08a"/>
          <path d="M141,394.8 A58,58 0 0 1 199,394.8" stroke="#9fd0b6"/>
          <path d="M199,394.8 A58,58 0 0 1 228,445" stroke="#d8d2cc"/>
        </g>
        <path d="M141,394.8 A58,58 0 0 1 199,394.8" fill="none" stroke="#2f7d5b" stroke-width="14"/>
        <path d="M170,445 L170,398" stroke="#24201f" stroke-width="5" stroke-linecap="round"/>
        <circle cx="170" cy="445" r="7" fill="#24201f"/>
        <text x="170" y="476" text-anchor="middle" font-size="16" font-weight="700" fill="#2f7d5b">lichaam op tempo</text>
        <text x="170" y="497" text-anchor="middle" font-size="14" fill="#5d5753">tempo van je lichaam</text>
        <!-- stap 1: genoeg hormoon -->
        <!-- stap 2: klachten -->
        <!-- stap 3: tablet -->
        <g>
          <rect x="344" y="288" width="54" height="26" rx="13" fill="#e4f2ea" stroke="#2f7d5b" stroke-width="3"/>
          <path d="M371,291 L371,311" stroke="#2f7d5b" stroke-width="2.5"/>
          <path d="M352,318 C312,342 272,346 240,336" stroke="#2f7d5b" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
          <path d="M248,328 L232,334 L246,344" stroke="#2f7d5b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="406" y="295" font-size="16" font-weight="700" fill="#2f7d5b">tablet met</text>
          <text x="406" y="315" font-size="16" font-weight="700" fill="#2f7d5b">schildklier-hormoon</text>
          <text x="340" y="380" font-size="16" fill="#24201f">1 keer per dag</text>
          <text x="340" y="404" font-size="16" fill="#24201f">vult aan wat je schildklier</text>
          <text x="340" y="424" font-size="16" fill="#24201f">te weinig maakt</text>
          <text x="340" y="462" font-size="17" font-weight="700" fill="#2f7d5b">weer op tempo</text>
          <text x="340" y="482" font-size="14" fill="#5d5753">(na een aantal weken)</text>
        </g>
      </svg>
