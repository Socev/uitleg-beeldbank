<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="sk-t2" width="600" height="200">
      <title id="sk-t2">Tijdlijn van de controles. Eerst het instellen: elke 6 weken bloed prikken. Is de goede hoeveelheid gevonden, dan 1 jaar lang elke 3 maanden. Daarna 1 keer per jaar.</title>
      <style>
svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
</style><defs><path id="sk-druppel" d="M0,-14 C5,-6 9,-1 9,5 A9,9 0 0 1 -9,5 C-9,-1 -5,-6 0,-14 Z"/></defs>
      <path d="M24,100 L572,100" stroke="#e9e2dc" stroke-width="6" stroke-linecap="round"/>
      <path d="M24,100 L224,100" stroke="#b85c00" stroke-width="6" stroke-linecap="round"/>
      <path d="M252,100 L428,100" stroke="#2a6f97" stroke-width="6" stroke-linecap="round"/>
      <path d="M456,100 L572,100" stroke="#2f7d5b" stroke-width="6" stroke-linecap="round"/>
      <g fill="#d9443f">
        <use href="#sk-druppel" x="54" y="78"/><use href="#sk-druppel" x="98" y="78"/><use href="#sk-druppel" x="142" y="78"/><use href="#sk-druppel" x="186" y="78"/>
        <use href="#sk-druppel" x="276" y="78"/><use href="#sk-druppel" x="320" y="78"/><use href="#sk-druppel" x="364" y="78"/><use href="#sk-druppel" x="408" y="78"/>
        <use href="#sk-druppel" x="514" y="78"/>
      </g>
      <g text-anchor="middle" font-size="18" font-weight="700">
        <text x="124" y="36" fill="#b85c00">Instellen</text>
        <text x="340" y="36" fill="#2a6f97">Eerste jaar</text>
        <text x="514" y="36" fill="#2f7d5b">Daarna</text>
      </g>
      <g text-anchor="middle" font-size="16" fill="#24201f">
        <text x="124" y="136">elke 6 weken</text>
        <text x="340" y="136">elke 3 maanden</text>
        <text x="514" y="136">1 keer per jaar</text>
      </g>
      <g text-anchor="middle" font-size="14" fill="#5d5753">
        <text x="124" y="158">tot je weinig klachten</text>
        <text x="124" y="176">hebt en het bloed goed is</text>
        <text x="340" y="158">als de goede</text>
        <text x="340" y="176">hoeveelheid gevonden is</text>
        <text x="514" y="158">of eerder</text>
        <text x="514" y="176">bij klachten</text>
      </g>
    </svg>
