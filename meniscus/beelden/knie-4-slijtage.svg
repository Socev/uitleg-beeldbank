<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="mn-t" width="700" height="560">
        <title id="mn-t">Links een knie van voren gezien, rechts de bovenkant van het scheenbeen van bovenaf gezien. Tussen het dijbeen en het scheenbeen liggen twee schijfjes kraakbeen: de binnen-meniscus en de buiten-meniscus. Bij een draaibeweging terwijl de voet stil staat, kan er een scheur in de meniscus komen en wordt de knie dik. Soms komt een los stukje klem te zitten: de knie gaat dan niet meer helemaal recht. Bij slijtage wordt de meniscus dunner en rafelig, met kleine scheurtjes.</title>
        <style>
svg { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
/* tekeningen: kleuren en bewegingen */
.zweef { animation: zweef 3.2s ease-in-out infinite alternate; transform-box: fill-box; }
.zweef.b { animation-delay: -1.1s; } .zweef.c { animation-delay: -2.1s; } .zweef.d { animation-duration: 2.6s; }
@keyframes zweef { from { transform: translate(-3px, -4px); } to { transform: translate(4px, 4px); } }
.stroom { stroke-dasharray: 10 14; animation: stroom 1.4s linear infinite; }
.stroom.traag { animation-duration: 3.2s; }
@keyframes stroom { to { stroke-dashoffset: -48; } }
.klop { transform-box: fill-box; transform-origin: center; animation: klop 1s ease-in-out infinite; }
.klop.zwak { animation: klopzwak 1.25s ease-in-out infinite; }
@keyframes klop { 0%, 60%, 100% { transform: scale(1); } 20% { transform: scale(1.13); } }
@keyframes klopzwak { 0%, 60%, 100% { transform: scale(1); } 20% { transform: scale(1.04); } }
.golf { transform-box: fill-box; transform-origin: center; animation: golf 1.6s ease-out infinite; }
@keyframes golf { 0% { transform: scale(.1); opacity: .9; } 70% { opacity: .35; } 100% { transform: scale(1); opacity: 0; } }
.seintje { stroke-dasharray: 26 400; animation: seintje 1.6s linear infinite; }
@keyframes seintje { 0%, 30% { stroke-dashoffset: 26; } 75%, 100% { stroke-dashoffset: -260; } }
.flikker { animation: flikker .9s steps(2, jump-none) infinite; }
.flikker.b { animation-duration: .7s; animation-delay: -.3s; } .flikker.c { animation-duration: 1.1s; animation-delay: -.5s; }
@keyframes flikker { 0% { opacity: 1; } 100% { opacity: .15; } }
.kamerslag { animation: kamerslag 4.6s linear infinite; }
@keyframes kamerslag { 0%, 4%, 17%, 21%, 30%, 34%, 58%, 62%, 70%, 74%, 92%, 96%, 100% { opacity: 0; }
  2%, 19%, 32%, 60%, 72%, 94% { opacity: .55; } }
.kamerslag-r { animation: kamerslagr 1.6s linear infinite; }
@keyframes kamerslagr { 0%, 45%, 62%, 100% { opacity: 0; } 52% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) {
  .zweef, .stroom, .klop, .golf, .seintje, .flikker, .kamerslag, .kamerslag-r { animation: none !important; }
  .golf { transform: scale(.4); opacity: .5; } .seintje { stroke-dasharray: none; opacity: .7; }
  .kamerslag, .kamerslag-r { opacity: .3; } .flikker { opacity: .8; }
}
</style><defs>
          <marker id="mn-pijl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b85c00"/></marker>
        </defs>
        <text x="8" y="26" font-size="18" font-weight="700" fill="#5d5753">van voren</text>
        <text x="8" y="46" font-size="15" fill="#5d5753">(rechterknie)</text>
        <text x="8" y="84" font-size="16" fill="#5d5753">buitenkant</text>
        <text x="530" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#5d5753">van bovenaf</text>

        <!-- VAN VOREN (knie van een rechterbeen: buitenkant links, binnenkant rechts) -->
        <g transform="translate(60,0)">
          <!-- huid -->
          <path d="M66,0 L234,0 C236,120 256,220 258,300 C258,360 236,400 228,450 L222,560 L80,560 L74,450 C66,400 40,360 40,300 C42,220 64,120 66,0 Z" fill="#f3ece6"/>
          <!-- vocht bij een scheur (2) -->
          <!-- kuitbeen -->
          <path d="M50,352 C48,338 70,334 76,344 L72,370 L68,560 L54,560 L52,370 Z" fill="#f4ead8" stroke="#c9b48f" stroke-width="3"/>
          <!-- dijbeen -->
          <path d="M120,0 L180,0 L182,170 C210,190 232,220 232,255 C232,278 220,290 202,290 C180,290 166,278 160,266 L150,262 L140,266 C134,278 120,290 98,290 C80,290 68,278 68,255 C68,220 90,190 118,170 Z" fill="#f4ead8" stroke="#c9b48f" stroke-width="3"/>
          <!-- scheenbeen -->
          <path d="M64,310 L136,310 L142,299 L148,310 L152,310 L158,299 L164,310 L236,310 C240,322 232,336 216,344 C200,352 186,360 182,380 L180,560 L122,560 L120,380 C116,360 102,352 86,344 C70,336 60,322 64,310 Z" fill="#f4ead8" stroke="#c9b48f" stroke-width="3" stroke-linejoin="round"/>
          <!-- kraakbeen op de botten -->
          <g stroke="#5f9fcc" stroke-width="6" fill="none" stroke-linecap="round">
            <path d="M72,266 C78,282 88,289 100,289 C116,289 128,280 136,270"/>
            <path d="M164,270 C172,280 184,289 200,289 C212,289 222,282 228,266"/>
            <path d="M70,307 L134,307 M166,307 L230,307"/>
          </g>
          <!-- menisci: gewoon (1,2,3) -->
          <!-- menisci bij slijtage (4): dunner en rafelig -->
          <g>
            <g fill="#8fd1c1" stroke="#2b8a75" stroke-width="2.5" stroke-linejoin="round">
              <path d="M60,286 C70,293 82,297 92,300 L98,298 L96,302 L104,303 L100,306 L60,307 Z"/>
              <path d="M240,286 C230,293 218,297 208,300 L202,298 L204,302 L196,303 L200,306 L240,307 Z"/>
            </g>
          </g>
          <!-- los stukje klem in het midden (3) -->
          <!-- draaibeweging (2) -->
          </g>

        <!-- labels van voren -->
        <g>
          <path d="M126,120 L104,120" stroke="#8f8f8f" stroke-width="2"/>
          <text x="52" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#24201f">dijbeen</text>
          <path d="M182,470 L104,470" stroke="#8f8f8f" stroke-width="2"/>
          <text x="52" y="466" text-anchor="middle" font-size="17" font-weight="700" fill="#24201f">scheen-</text>
          <text x="52" y="486" text-anchor="middle" font-size="17" font-weight="700" fill="#24201f">been</text>
        </g>
        <!-- VAN BOVENAF: bovenkant van het scheenbeen, voorkant onder -->
        <ellipse cx="530" cy="200" rx="140" ry="92" fill="#f4ead8" stroke="#c9b48f" stroke-width="3"/>
        <g fill="#dceaf5"><circle cx="472" cy="200" r="34"/><circle cx="592" cy="200" r="38"/></g>
        <g fill="#f4ead8" stroke="#c9b48f" stroke-width="2.5"><circle cx="520" cy="196" r="7"/><circle cx="540" cy="204" r="7"/></g>
        <!-- menisci gewoon (1,2) -->
        <!-- scheur (2) -->
        <!-- knie op slot (3): buitenkant blijft liggen, binnenstuk is naar het midden geklapt -->
        <!-- slijtage (4): dunner en rafelig, kleine scheurtjes -->
        <g>
          <g fill="none" stroke-linecap="round">
            <g stroke="#2b8a75" stroke-width="20">
              <path d="M509.3,172.5 A48,48 0 1 0 509.3,227.5"/>
              <path d="M580.6,146.8 A54,54 0 1 1 580.6,253.2"/>
            </g>
            <g stroke="#8fd1c1" stroke-width="15">
              <path d="M509.3,172.5 A48,48 0 1 0 509.3,227.5"/>
              <path d="M580.6,146.8 A54,54 0 1 1 580.6,253.2"/>
            </g>
          </g>
          <path d="M593.8,156.2 L595.0,143.2 M615.2,164.0 L622.7,153.3 M629.9,181.4 L641.7,175.9 M633.8,203.8 L646.8,205.0 M626.0,225.2 L636.7,232.7 M608.6,239.9 L614.1,251.7 M586.2,243.8 L585.0,256.8 M466.6,238.9 L465.6,250.8 M442.4,227.6 L433.9,236.1 M431.0,200.0 L419.0,200.0 M442.4,172.4 L433.9,163.9 M466.6,161.1 L465.6,149.2" stroke="#a8302c" stroke-width="2.5" stroke-linecap="round"/>
        </g>
        <!-- labels van bovenaf -->
        <text x="530" y="318" text-anchor="middle" font-size="16" fill="#5d5753">voorkant van de knie</text>
        <text x="420" y="94" text-anchor="middle" font-size="16" fill="#5d5753">buitenkant</text>
        <text x="640" y="94" text-anchor="middle" font-size="16" fill="#5d5753">binnenkant</text>
        <g>
          <text x="530" y="380" text-anchor="middle" font-size="19" font-weight="700" fill="#b85c00">slijtage</text>
          <text x="530" y="404" text-anchor="middle" font-size="16" fill="#5d5753">dunner, rafelig,</text>
          <text x="530" y="424" text-anchor="middle" font-size="16" fill="#5d5753">kleine scheurtjes</text>
          <text x="530" y="460" text-anchor="middle" font-size="16" fill="#5d5753">hoort vaak bij ouder worden,</text>
          <text x="530" y="480" text-anchor="middle" font-size="16" fill="#5d5753">soms samen met artrose</text>
        </g>
      </svg>
